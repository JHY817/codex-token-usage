name: Release macOS app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            swift_arch: arm64
            node_arch: arm64
          - arch: x64
            swift_arch: x86_64
            node_arch: x64
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm ci --prefix ui
      - run: npm run check

      - name: Download target Node.js runtime
        shell: bash
        run: |
          set -euo pipefail
          NODE_VERSION="$(node -p 'process.versions.node')"
          ARCHIVE="node-v${NODE_VERSION}-darwin-${{ matrix.node_arch }}.tar.gz"
          mkdir -p .release-runtime
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/${ARCHIVE}"
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt"
          grep " ${ARCHIVE}$" SHASUMS256.txt | shasum -a 256 -c -
          tar -xzf "$ARCHIVE" -C .release-runtime --strip-components=1
          rm "$ARCHIVE" SHASUMS256.txt

      - name: Build self-contained app
        env:
          CODEX_BUILD_ARCH: ${{ matrix.arch }}
          CODEX_BUNDLED_NODE: ${{ github.workspace }}/.release-runtime/bin/node
          CODEX_BUNDLED_NODE_LICENSE: ${{ github.workspace }}/.release-runtime/LICENSE
        run: npm run native:build

      - name: Sign and notarize when credentials are configured
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          VALUES=("$MACOS_CERTIFICATE_P12_BASE64" "$MACOS_CERTIFICATE_PASSWORD" "$APPLE_SIGNING_IDENTITY" "$APPLE_API_KEY_BASE64" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER")
          CONFIGURED=0
          for VALUE in "${VALUES[@]}"; do [[ -n "$VALUE" ]] && CONFIGURED=$((CONFIGURED + 1)); done
          if [[ "$CONFIGURED" -eq 0 ]]; then
            echo "Apple signing secrets are not configured; publishing an unsigned preview build."
            exit 0
          fi
          [[ "$CONFIGURED" -eq 6 ]] || { echo "Apple signing secrets are incomplete" >&2; exit 1; }

          KEYCHAIN="$RUNNER_TEMP/codex-token-usage.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE="$RUNNER_TEMP/certificate.p12"
          API_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          APP="dist/macos/Codex Token Usage.app"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$APP/Contents/Resources/runtime/node"
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Package DMG and ZIP
        env:
          CODEX_BUILD_ARCH: ${{ matrix.arch }}
        run: npm run release:package

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum Codex-Token-Usage-* > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --generate-notes --title "Codex Token Usage ${GITHUB_REF_NAME}"
