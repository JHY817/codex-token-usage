name: Bug report
description: 报告可复现的问题（不要上传真实会话内容）
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先删除截图和日志中的提示词、回复、用户名及本机路径。
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.2
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac architecture
      options: [Apple Silicon, Intel]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: 实际结果、预期结果和复现步骤
    validations:
      required: true
